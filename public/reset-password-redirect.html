<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; color: #333; }
    .card { background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.08); text-align: center; max-width: 400px; }
    h2 { margin: 0 0 8px; font-weight: 700; }
    p { color: #666; margin: 0; font-size: 14px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1E3A8A; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Verifying your link...</h2>
    <p>Please wait while we redirect you back to the app.</p>
  </div>
  <script>
    (function() {
      var hash = window.location.hash.substring(1);
      if (hash) {
        var appUrl = 'wattwatch://(auth)/update-password?' + hash;
        window.location.href = appUrl;
      } else {
        document.querySelector('.card').innerHTML = '<h2>Invalid Link</h2><p>This reset link is missing the required tokens. Please request a new password reset.</p>';
      }
    })();
  </script>
</body>
</html>
